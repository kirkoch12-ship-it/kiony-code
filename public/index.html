<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiony Code</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#1b1b1b;color:#d8d8d8;font:14px/1.55 ui-monospace,Menlo,Consolas,"Courier New",monospace;display:flex;flex-direction:column;padding-bottom:72px}
#auth{margin:30px auto;width:100%;max-width:340px;padding:0 16px;display:flex;flex-direction:column;gap:9px}
#auth .t{color:#d97757;font-weight:700}
.f{background:#141414;border:1px solid #3a3a3a;color:#fff;padding:9px 10px;border-radius:6px;font:inherit;outline:none}
.f:focus{border-color:#d97757}
button{background:#d8d8d8;color:#111;border:0;border-radius:6px;padding:9px;font:600 14px ui-monospace,monospace;cursor:pointer}
button.g{background:none;color:#ccc;border:1px solid #3a3a3a}
#aerr{color:#f87171;min-height:20px}
#head{margin:12px 12px 0;border:1px solid #3a3a3a;border-radius:10px;padding:12px 14px;display:flex;gap:16px;align-items:center}
.crab{flex:0 0 auto;width:92px;height:auto;display:block}
.info{min-width:0;flex:1}
.info div{white-space:normal;word-break:break-word}
.info b{color:#fff}
.info .s{color:#8a8a8a}
#log{flex:1;overflow-y:auto;padding:12px 14px;min-height:120px}
.msg{margin:8px 0;white-space:pre-wrap;word-break:break-word}
.msg.user{background:#2c2c2c;border-radius:6px;padding:6px 10px;color:#fff}
.msg.bot::before{content:"●";color:#fff;font-size:8px;vertical-align:middle;margin-right:8px}
.msg.sys{color:#8a8a8a}
.msg.err{color:#f87171}
.msg.hint{color:#e0a458;font-size:13px}
.msg.think{color:#d97757}
#menu{margin:0 12px;border:1px solid #3a3a3a;border-radius:8px;background:#202020;max-height:200px;overflow-y:auto}
#menu div{padding:7px 10px;cursor:pointer;display:flex;gap:14px}
#menu div:hover{background:#2c2c2c}
#menu span{color:#8a8a8a}
#inbox{margin:8px 12px 0;border:1px solid #3a3a3a;border-radius:10px;padding:9px 12px;display:flex;gap:8px;align-items:center}
#inbox .p{color:#d97757}
#in{flex:1;background:none;border:0;color:#fff;font:inherit;outline:none;min-width:0}
#status{padding:6px 14px 10px;color:#7a7a7a;font-size:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal{background:#202020;border:1px solid #3a3a3a;border-radius:10px;padding:14px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto}
#modal h3{margin:0 0 10px;color:#fff;font-size:15px}
.row{padding:8px 0;border-bottom:1px solid #2c2c2c}
.row.on{color:#d97757}
.tbtn{display:block;width:100%;background:none;color:#ddd;border:1px solid #3a3a3a;text-align:left;margin:5px 0;padding:9px}
.tbtn:hover{border-color:#d97757}
.tbtn:disabled{opacity:.4}
.hintp{color:#8a8a8a;font-size:13px;margin-top:10px}
</style>
</head>
<body>

<div id="auth">
  <div class="t">Kiony Code</div>
  <input id="em" class="f" type="email" placeholder="почта" autocomplete="email">
  <input id="pw" class="f" type="password" placeholder="пароль (от 6 символов)" autocomplete="current-password">
  <button id="login">Войти</button>
  <button id="reg" class="g">Регистрация</button>
  <div id="aerr"></div>
</div>

<div id="head" hidden>
  <svg class="crab" viewBox="0 0 352 220" aria-hidden="true">
    <rect x="44" y="0" width="264" height="176" fill="#d97757"/>
    <rect x="0" y="88" width="44" height="44" fill="#d97757"/>
    <rect x="308" y="88" width="44" height="44" fill="#d97757"/>
    <rect x="66" y="176" width="22" height="44" fill="#d97757"/>
    <rect x="110" y="176" width="22" height="44" fill="#d97757"/>
    <rect x="220" y="176" width="22" height="44" fill="#d97757"/>
    <rect x="264" y="176" width="22" height="44" fill="#d97757"/>
    <rect x="88" y="44" width="22" height="44" fill="#1b1b1b"/>
    <rect x="242" y="44" width="22" height="44" fill="#1b1b1b"/>
  </svg>
  <div class="info">
    <div><b>Kiony Code</b> <span class="s">v1.0</span></div>
    <div id="h1" class="s"></div>
    <div id="h2" class="s"></div>
    <div id="h3" class="s"></div>
  </div>
</div>

<div id="log" hidden></div>
<div id="menu" hidden></div>
<div id="inbox" hidden><span class="p">❯</span><input id="in" autocomplete="off" placeholder="напиши запрос или / для команд"></div>
<div id="status" hidden><span id="stL"></span><span>/ команды</span></div>
<div id="mask" hidden><div id="modal"></div></div>

<script>
const $ = s => document.querySelector(s);
const API = '/api';
const PREF = ['claude-haiku-5-5', 'gpt-6-luna', 'doubao-seed-2-0-mini-260215'];
const CMDS = [
  ['/models', 'выбрать модель'], ['/plans', 'тарифы и подписка'], ['/limits', 'лимиты на сегодня'],
  ['/code', 'ввести код активации'], ['/settings', 'настройки'], ['/clear', 'очистить чат'],
  ['/chats', 'чаты для агента'], ['/write', 'черновик через агента'], ['/send', 'отправить черновик'], ['/cancel', 'отменить черновик'],
  ['/help', 'помощь'], ['/logout', 'выйти'],
];
let token = localStorage.getItem('kc_token') || '';
let st = null, model = PREF[0], hist = [], busy = false, stopReq = false;

const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const say = (cls, text) => { const d = el('div', 'msg ' + cls, text); $('#log').appendChild(d); $('#log').scrollTop = 1e9; return d; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Все запросы идут через сервер. Ключ CometAPI на странице не нужен.
async function call(path, body) {
  const r = await fetch(API + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Ошибка ' + r.status);
  return j;
}

function renderHead() {
  if (!st) return;
  const u = st.usage, l = st.limits;
  $('#h1').textContent = `${st.planName} · ${model}`;
  $('#h2').textContent = st.email;
  $('#h3').textContent = `запросы ${u.r}/${l.req} · токены ${u.t}/${l.tok} · $${u.c.toFixed(4)}/${l.bud} в день`;
  $('#stL').textContent = `план ${st.planName} · ${model}`;
}

function clearChat() {
  $('#log').innerHTML = '';
  hist = [];
  say('sys', 'Чат очищен.');
}

function closeM() { $('#mask').hidden = true; }

function modal(title, build) {
  const box = $('#modal');
  box.innerHTML = '';
  box.append(el('h3', null, title));
  build(box);
  const x = el('button', 'g', 'Закрыть');
  x.style.width = '100%'; x.style.marginTop = '10px';
  x.onclick = closeM;
  box.append(x);
  $('#mask').hidden = false;
}

function openModels() {
  modal(`Модели · план ${st.planName}`, box => {
    st.models.forEach(m => {
      const b = el('button', 'tbtn', `${m.id === model ? '● ' : '   '}${m.name}  —  ${m.cap ? 'лимит ' + m.cap + ' в день' : 'недоступна на плане'}`);
      b.disabled = !m.cap;
      b.onclick = () => { model = m.id; closeM(); renderHead(); say('sys', 'Модель: ' + m.name); };
      box.append(b);
    });
  });
}

function openPlans() {
  modal('Тарифы', box => {
    st.plans.forEach(p => {
      box.append(el('div', 'row' + (p.name === st.planName ? ' on' : ''),
        `${p.name}   $${p.m}/мес · $${p.w}/нед   запросов ${p.req}, токенов ${p.tok}, расход $${p.bud}/день`));
    });
    box.append(el('div', 'hintp', 'Купить подписку: напиши @kionylixe в Telegram. После оплаты введи полученный код командой /code КОД.'));
  });
}

async function openSettings() {
  const tg = await call('/tg');
  modal('Настройки', box => {
    box.append(el('div', 'row', `Аккаунт: ${st.email}`));
    box.append(el('div', 'row', `План: ${st.planName}${st.until ? ' до ' + new Date(st.until).toLocaleDateString('ru') : ''}`));
    const a = el('button', 'tbtn', 'Очистить чат');
    a.onclick = () => { closeM(); clearChat(); };
    const b = el('button', 'tbtn', 'Выйти из аккаунта');
    b.onclick = () => { closeM(); logout(); };
    box.append(a, b);

    box.append(el('div', 'hintp', 'Telegram-агент. api_id и api_hash возьми на my.telegram.org → API development tools.'));
    const apiId = el('input', 'f'); apiId.placeholder = 'api_id (число)'; apiId.value = tg.apiId || '';
    const apiHash = el('input', 'f'); apiHash.placeholder = tg.hasHash ? 'api_hash сохранён (впиши новый, чтобы заменить)' : 'api_hash';
    const dev = el('select', 'f');
    [['pc', 'ПК'], ['phone', 'Телефон (Termux)']].forEach(([v, t]) => {
      const o = el('option', null, t); o.value = v; if (tg.device === v) o.selected = true; dev.appendChild(o);
    });
    const consent = el('input'); consent.type = 'checkbox'; consent.checked = !!tg.consentAt;
    const cl = el('label', 'hintp', 'Я понимаю, что Telegram может ограничить или заблокировать аккаунт за автоматизацию. Защита (паузы 30 минут, подтверждение каждого сообщения, только знакомые чаты) снижает риск, но полностью его не исключает. Ответственность за свой аккаунт беру на себя.');
    cl.prepend(consent);
    const save = el('button', 'tbtn', 'Сохранить Telegram');
    save.onclick = async () => {
      try {
        await call('/tg', { apiId: apiId.value, apiHash: apiHash.value, device: dev.value, consent: consent.checked });
        closeM(); say('sys', 'Настройки Telegram сохранены');
      } catch (e) { closeM(); say('err', 'Ошибка: ' + e.message); }
    };
    const get = el('button', 'tbtn', 'Получить токен агента');
    get.onclick = async () => {
      try {
        const { token } = await call('/agent/token', {});
        closeM();
        say('sys', 'Токен агента (храни как пароль): ' + token);
        say('sys', dev.value === 'phone'
          ? 'Телефон: установи Termux, выполни pkg install nodejs, положи файл tg-agent.mjs в папку и запусти: npm i telegram && node tg-agent.mjs'
          : 'ПК: установи Node.js с nodejs.org, в папке с файлом tg-agent.mjs выполни: npm i telegram && node tg-agent.mjs');
      } catch (e) { closeM(); say('err', 'Ошибка: ' + e.message); }
    };
    box.append(apiId, apiHash, dev, cl, save, get);
  });
}

function logout() {
  localStorage.removeItem('kc_token');
  location.reload();
}

function showMenu(v) {
  const m = $('#menu');
  if (!v.startsWith('/')) { m.hidden = true; return; }
  const word = v.split(' ')[0].toLowerCase();
  const list = CMDS.filter(c => c[0].startsWith(word));
  m.innerHTML = '';
  list.forEach(([c, d]) => {
    const r = el('div');
    r.append(el('b', null, c), el('span', null, d));
    r.onclick = () => { $('#in').value = c + ' '; $('#in').focus(); showMenu($('#in').value); };
    m.appendChild(r);
  });
  m.hidden = !list.length;
}

async function enter() {
  st = await call('/me');
  $('#auth').hidden = true; $('#head').hidden = false; $('#log').hidden = false;
  $('#inbox').hidden = false; $('#status').hidden = false;
  const ok = id => st.models.some(m => m.id === id && m.cap);
  if (!ok(model)) model = PREF.find(ok) || (st.models.find(m => m.cap) || {}).id || model;
  renderHead();
  if (!$('#log').childElementCount) say('sys', 'Добро пожаловать в Kiony Code. Напиши запрос или / для команд.');
  $('#in').focus();
}

async function auth(action) {
  $('#aerr').textContent = '';
  try {
    const j = await call('/auth', { action, email: $('#em').value, password: $('#pw').value });
    token = j.token; localStorage.setItem('kc_token', token);
    await enter();
  } catch (e) { $('#aerr').textContent = e.message; }
}

let taskIds = {};
async function pollTask(id, want) {
  const t0 = Date.now();
  while (Date.now() - t0 < 240000) {
    await sleep(2500);
    const t = await call('/task?id=' + encodeURIComponent(id));
    if (t.status === want) return t;
    if (t.status === 'error') { say('err', 'Ошибка: ' + t.error); return null; }
    if (t.status === 'cancelled') return null;
  }
  say('err', 'Агент не ответил за 4 минуты. Проверь, что он запущен на устройстве.');
  return null;
}

async function command(line) {
  const [c, ...r] = line.trim().split(/\s+/);
  const arg = r.join(' ');
  if (c === '/models') return openModels();
  if (c === '/plans') return openPlans();
  if (c === '/settings') return openSettings();
  if (c === '/limits') {
    const l = st.limits, u = st.usage;
    return say('sys', `План ${st.planName}: запросы ${u.r}/${l.req}, токены ${u.t}/${l.tok}, расход $${u.c.toFixed(5)}/${l.bud} в день. Сообщение до ${l.inTok} токенов, ответ до ${l.maxTok}.`);
  }
  if (c === '/model') {
    const m = st.models.find(x => x.id === arg);
    if (!m) return say('err', 'Нет такой модели. Открой /models');
    if (!m.cap) return say('err', `${m.name} недоступна на плане ${st.planName}`);
    model = m.id; renderHead(); return say('sys', 'Модель: ' + m.name);
  }
  if (c === '/code') {
    const j = await call('/code', { code: arg });
    say('sys', `План ${j.plan} активирован`);
    return enter();
  }
  if (c === '/chats') {
    const { dialogs } = await call('/chats');
    if (!dialogs.length) return say('sys', 'Чатов пока нет. Запусти агента на устройстве (токен в /settings).');
    return dialogs.forEach((d, i) => say('sys', `${i}. ${d.title} · ${d.type === 'user' ? 'личный' : d.type === 'group' ? 'группа' : 'канал'}${d.canPost ? '' : ' · писать нельзя'}`));
  }
  if (c === '/write') {
    const m = arg.match(/^(\d+)\s+([\s\S]+)$/);
    if (!m) return say('err', 'Формат: /write НОМЕР что написать (номер из /chats)');
    const { id } = await call('/task/new', { index: Number(m[1]), instruction: m[2], model });
    const short = id.slice(0, 8);
    taskIds[short] = id;
    say('sys', `Задача ${short}: агент читает переписку и готовит черновик…`);
    pollTask(id, 'draft')
      .then(t => { if (t) { say('bot', t.draft); say('hint', `Отправить: /send ${short} · Отменить: /cancel ${short}`); } })
      .catch(e => say('err', 'Ошибка: ' + e.message));
    return;
  }
  if (c === '/send' || c === '/cancel') {
    const id = taskIds[arg];
    if (!id) return say('err', 'Нет такой задачи. Номер берётся из строки «Задача …».');
    if (c === '/cancel') { await call('/task/cancel', { id }); return say('sys', 'Черновик отменён'); }
    await call('/task/approve', { id });
    say('sys', 'Подтверждено. Агент отправит сообщение через несколько секунд…');
    pollTask(id, 'sent')
      .then(t => { if (t) say('sys', 'Сообщение отправлено ✓'); })
      .catch(e => say('err', 'Ошибка: ' + e.message));
    return;
  }
  if (c === '/clear') return clearChat();
  if (c === '/help') return say('sys', '/models — модели · /model ID — выбрать · /plans — тарифы · /limits — лимиты · /code КОД — активировать план · /settings — настройки · /clear — очистить чат · /logout — выйти');
  if (c === '/logout') return logout();
  say('err', 'Неизвестная команда. /help');
}

async function run(text) {
  if (!st.models.some(m => m.id === model && m.cap)) return say('err', 'Модель недоступна на твоём плане. Выбери другую: /models');
  say('user', '❯ ' + text);
  hist.push({ role: 'user', content: text });
  const t0 = Date.now();
  const sp = el('div', 'msg think', '✻ Думаю…');
  $('#log').appendChild(sp);
  $('#log').scrollTop = 1e9;
  const tick = setInterval(() => { sp.textContent = `✻ Думаю… ${((Date.now() - t0) / 1000).toFixed(1)} с`; }, 150);
  try {
    // Ответ готовится в фоне: сначала получаем номер задачи, потом ждём результат
    stopReq = false;
    const stopLine = el('div', 'msg hint', '■ Остановить');
    stopLine.id = 'stopLine';
    stopLine.style.cursor = 'pointer';
    stopLine.onclick = () => { stopReq = true; };
    $('#log').appendChild(stopLine);
    const { jobId } = await call('/chat', { model, messages: hist.slice(-12) });
    let res;
    for (;;) {
      await sleep(1500);
      if (stopReq) throw new Error('остановлено');
      res = await call('/job?id=' + encodeURIComponent(jobId));
      if (res.status !== 'pending') break;
      if (Date.now() - t0 > 120000) throw new Error('модель не ответила за 2 минуты. Выбери другую: /models');
    }
    if (res.status === 'error') throw new Error(res.error);
    hist.push({ role: 'assistant', content: res.reply });
    sp.remove();
    say('bot', res.reply);
    st = await call('/me');
    renderHead();
  } catch (e) {
    hist.pop();
    sp.remove();
    if (e.message === 'остановлено') say('sys', 'Остановлено. Можно писать дальше.');
    else {
      say('err', 'Ошибка: ' + e.message);
      if (/endpoint|unavailable|closed|недоступ|2 минуты/i.test(e.message)) say('hint', 'Эта модель сейчас недоступна или отвечает слишком долго. Выбери другую: /models');
    }
  } finally { clearInterval(tick); document.getElementById('stopLine')?.remove(); }
}

$('#mask').onclick = e => { if (e.target.id === 'mask') closeM(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && busy) stopReq = true; });
$('#login').onclick = () => auth('login');
$('#reg').onclick = () => auth('register');
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') auth('login'); });
$('#in').addEventListener('input', e => showMenu(e.target.value));
$('#in').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target.value.trim();
  e.target.value = '';
  showMenu('');
  if (!t || busy) return;
  busy = true;
  const job = t.startsWith('/') ? command(t) : run(t);
  job.catch(err => say('err', 'Ошибка: ' + err.message)).finally(() => { busy = false; });
});

if (token) enter().catch(() => { token = ''; localStorage.removeItem('kc_token'); });
</script>
</body>
</html>
