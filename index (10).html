<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiony Code</title>
<style>
[hidden]{display:none!important}
body{margin:0;background:#0b0b0b;color:#e6e6e6;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
#top{padding:10px 14px;border-bottom:1px solid #222;color:#888;word-break:break-word}
#top b{color:#fff}
#auth{padding:16px;display:flex;flex-direction:column;gap:9px;max-width:340px}
.f{background:#151515;border:1px solid #2a2a2a;color:#fff;padding:9px 10px;border-radius:6px;font:inherit;outline:none}
.f:focus{border-color:#555}
button{background:#fff;color:#000;border:0;border-radius:6px;padding:9px;font:600 14px ui-monospace,monospace;cursor:pointer}
button.g{background:none;color:#ccc;border:1px solid #333}
#aerr{color:#f87171;min-height:20px}
#out{padding:14px;height:calc(100vh - 135px);overflow-y:auto;white-space:pre-wrap;word-break:break-word}
#out div{margin:2px 0}
.u{color:#fff}.a{color:#d6d6d6}.e{color:#f87171}.s{color:#777}
#bar{border-top:1px solid #222;padding:10px 14px;display:flex;gap:8px;align-items:center}
#bar span{color:#e0a458}
#in{flex:1;background:none;border:0;color:#fff;font:inherit;outline:none}
</style>
</head>
<body>
<div id="top"><b>Kiony Code</b> <span id="st">вход не выполнен</span></div>

<div id="auth">
  <div class="s">Вход в Kiony Code</div>
  <input id="em" class="f" type="email" placeholder="почта" autocomplete="email">
  <input id="pw" class="f" type="password" placeholder="пароль (от 6 символов)" autocomplete="current-password">
  <button id="login">Войти</button>
  <button id="reg" class="g">Регистрация</button>
  <div id="aerr"></div>
</div>

<div id="out" hidden></div>
<div id="bar" hidden><span>❯</span><input id="in" autocomplete="off" placeholder="напиши запрос или /help"></div>

<script>
const $ = s => document.querySelector(s);
const out = $('#out');
const API = '/api';
let token = localStorage.getItem('kc_token') || '';
let st = null;
let model = 'doubao-seed-2-0-mini-260215';
let hist = [];

const print = (t, c = 'a') => {
  const d = document.createElement('div');
  d.className = c; d.textContent = t;
  out.appendChild(d); out.scrollTop = out.scrollHeight;
  return d;
};

async function call(path, body) {
  const r = await fetch(API + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Ошибка ' + r.status);
  return j;
}

function renderTop() {
  if (!st) return;
  const u = st.usage, l = st.limits;
  $('#st').textContent = `${st.email} · ${st.planName} · ${model} · запросы ${u.r}/${l.req} · токены ${u.t}/${l.tok} · $${u.c.toFixed(4)}/${l.bud}`;
}

async function enter() {
  st = await call('/me');
  $('#auth').hidden = true; out.hidden = false; $('#bar').hidden = false;
  renderTop();
  if (!out.childElementCount) print('Kiony Code. Напиши запрос или /help.', 's');
  $('#in').focus();
}

async function auth(action) {
  $('#aerr').textContent = '';
  try {
    const j = await call('/auth', { action, email: $('#em').value, password: $('#pw').value });
    token = j.token; localStorage.setItem('kc_token', token);
    await enter();
  } catch (e) { $('#aerr').textContent = e.message; }
}

async function command(line) {
  const [cmd, ...rest] = line.split(' ');
  const arg = rest.join(' ').trim();
  if (cmd === '/help') return print('/models    модели и лимиты на сегодня\n/model <id>  выбрать модель\n/limits    лимиты и расход за сегодня\n/code <КОД>  активировать план\n/clear     очистить экран\n/logout    выйти', 's');
  if (cmd === '/models') return st.models.forEach(m => print(`${m.id === model ? '● ' : '  '}${m.id}  ${m.name}  ${m.cap ? 'лимит ' + m.cap + ' в день' : 'недоступна на плане ' + st.planName}`));
  if (cmd === '/model') {
    const m = st.models.find(x => x.id === arg);
    if (!m) return print('Нет такой модели. Список: /models', 'e');
    if (!m.cap) return print(`${m.name} недоступна на плане ${st.planName}`, 'e');
    model = m.id; renderTop(); return print(`Модель: ${m.name}`, 's');
  }
  if (cmd === '/limits') {
    const l = st.limits, u = st.usage;
    return print(`План ${st.planName}\nзапросы ${u.r}/${l.req}\nтокены ${u.t}/${l.tok}\nрасход $${u.c.toFixed(5)}/${l.bud} в день\nсообщение до ${l.inTok} токенов, ответ до ${l.maxTok}`, 's');
  }
  if (cmd === '/code') { const j = await call('/code', { code: arg }); print(`План ${j.plan} активирован`, 's'); return enter(); }
  if (cmd === '/clear') { out.innerHTML = ''; hist = []; return; }
  if (cmd === '/logout') { localStorage.removeItem('kc_token'); location.reload(); return; }
  print('Неизвестная команда. /help', 'e');
}

async function run(text) {
  const m = st.models.find(x => x.id === model);
  if (!m || !m.cap) return print(`Модель недоступна на плане ${st.planName}. Выбери другую: /models`, 'e');
  hist.push({ role: 'user', content: text });
  const t0 = Date.now(), sp = print('', 's');
  const tick = setInterval(() => { sp.textContent = `⠋ думаю… ${((Date.now() - t0) / 1000).toFixed(1)} с`; }, 150);
  try {
    const j = await call('/chat', { model, messages: hist.slice(-12) });
    hist.push({ role: 'assistant', content: j.reply });
    sp.remove(); print(j.reply, 'a');
    st = await call('/me'); renderTop();
  } catch (e) {
    hist.pop(); sp.remove(); print('Ошибка: ' + e.message, 'e');
  } finally { clearInterval(tick); }
}

$('#in').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target.value.trim();
  e.target.value = '';
  if (!t) return;
  print('❯ ' + t, 'u');
  const job = t.startsWith('/') ? command(t) : run(t);
  job.catch(err => print('Ошибка: ' + err.message, 'e'));
});

$('#login').onclick = () => auth('login');
$('#reg').onclick = () => auth('register');
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') auth('login'); });

if (token) enter().catch(() => { token = ''; localStorage.removeItem('kc_token'); });
</script>
</body>
</html>
